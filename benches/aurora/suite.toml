# Every map operation at 1K, 100K and 1M keys, under two hashers that are
# compared separately: `fast`, Codira's unkeyed hash in all three
# (`Map.unkeyed()`), and `secure`, each language's default keyed SipHash-1-3
# (`Map.new()`, Rust's `HashMap::new()`; C++ has none). 1K and 100K repeat
# the operation 1000 and 10 times.
[[workload]]
name = "hashmap"
title = "Hash maps: the same unkeyed hash, and the default keyed (secure) hash, separately"
kernels = [
  { name = "insert_i64_fast_1k", entry = "map_int", args = [0, 0, 1000] },
  { name = "hit_i64_fast_1k", entry = "map_int", args = [1, 0, 1000] },
  { name = "miss_i64_fast_1k", entry = "map_int", args = [2, 0, 1000] },
  { name = "iter_i64_fast_1k", entry = "map_int", args = [3, 0, 1000] },
  { name = "remove_i64_fast_1k", entry = "map_int", args = [4, 0, 1000] },
  { name = "insert_i64_fast_100k", entry = "map_int", args = [0, 0, 100000] },
  { name = "hit_i64_fast_100k", entry = "map_int", args = [1, 0, 100000] },
  { name = "miss_i64_fast_100k", entry = "map_int", args = [2, 0, 100000] },
  { name = "iter_i64_fast_100k", entry = "map_int", args = [3, 0, 100000] },
  { name = "remove_i64_fast_100k", entry = "map_int", args = [4, 0, 100000], ci = true },
  { name = "insert_i64_fast_1m", entry = "map_int", args = [0, 0, 1000000], ci = true },
  { name = "hit_i64_fast_1m", entry = "map_int", args = [1, 0, 1000000], ci = true },
  { name = "miss_i64_fast_1m", entry = "map_int", args = [2, 0, 1000000], ci = true },
  { name = "iter_i64_fast_1m", entry = "map_int", args = [3, 0, 1000000] },
