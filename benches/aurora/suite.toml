[[workload]]
name = "json"
title = "JSON: parsing, printing, pretty-printing, streaming, typed decoding"
setup = ["gen_inputs.py"]
rust_cargo = "rust/Cargo.toml"
rust_bin = "aurora_json_rust"
cxx_requires = "RapidJSON headers (`rapidjson-dev`)"
cxx = "g++"
cxx_why = "RapidJSON 1.1, as packaged, assigns to a const member in `GenericStringRef`, which clang 22 rejects"
kernels = [
  { name = "parse_twitter", ci = true },
  { name = "parse_canada", ci = true },
  { name = "parse_deep" },
  { name = "print_twitter", ci = true },
  { name = "print_canada", ci = true, check_differs = { cpp = "RapidJSON prints 320 of the 600,000 floats one or two digits longer than the shortest round-trip text (Grisu2), 357 bytes in all; the values read back the same" } },
  { name = "print_deep" },
  { name = "pretty_twitter" },
  { name = "pretty_canada", check_differs = { cpp = "RapidJSON prints 320 of the 600,000 floats one or two digits longer than the shortest round-trip text (Grisu2), 357 bytes in all; the values read back the same" } },
  { name = "pretty_deep" },
  { name = "stream_twitter" },
  { name = "stream_canada" },
  { name = "stream_deep" },
  { name = "typed_twitter", cpp = "RapidJSON has no typed decoding: a SAX state machine per struct, written by hand, would measure that code, not a library's" },
]

# A heap cap well above the live set, so that the collector runs often.
[[workload]]
name = "graph"
title = "Object graphs: allocation-heavy trees, cyclic graphs"
heap_limit_mb = 256
kernels = [
  { name = "binary_trees", ci = true },
  { name = "cyclic_graph", ci = true },
  { name = "linked_list" },
]

[[workload]]
name = "channels"
title = "Concurrent producers and consumers (bounded channels)"
kernels = [
  { name = "spsc", ci = true, note = "Rust's `sync_channel` (from crossbeam) spins before it sleeps; the C++ queue is the textbook mutex and condition variables, which sleep and wake a thread for most messages. Rust is the strong baseline here." },
  { name = "mpsc_4", note = "Not in the CI subset: the C++ queue takes about 20 s here." },
  { name = "fan_out_in", note = "Bound by the latency of waking a worker: each job meets an empty channel." },
]

[[workload]]
name = "server"
title = "A server-style workload with high churn, and long runs under constrained heaps"
kernels = [
  { name = "requests", ci = true },
  { name = "long_run_heap_1024", entry = "long_run", arg = "long_run", heap_limit_mb = 1024 },
  { name = "long_run_heap_256", entry = "long_run", arg = "long_run", heap_limit_mb = 256 },
  { name = "long_run_heap_128", entry = "long_run", arg = "long_run", heap_limit_mb = 128, ci = true },
  { name = "long_run_heap_96", entry = "long_run", arg = "long_run", heap_limit_mb = 96 },
  { name = "long_run_heap_80", entry = "long_run", arg = "long_run", heap_limit_mb = 80 },
  { name = "long_run_heap_64", entry = "long_run", arg = "long_run", heap_limit_mb = 64 },
  { name = "long_run_heap_48", entry = "long_run", arg = "long_run", heap_limit_mb = 48, expected_failure = { codira = "the runtime ends the program out of memory: about 51 MB are live after a full collection, and a collection cannot make room under the cap" } },
]

# The same Codira function on the GC heap and with `@region`; C++'s region
# is std::pmr::monotonic_buffer_resource; Rust's standard library has none.
[[workload]]
name = "regions"
title = "`@region` functions: an arena per call, against the GC heap"
heap_limit_mb = 256
kernels = [
  { name = "list_heap", ci = true },
  { name = "list_region", ci = true, note = "Rust: `Box`, the same program as `list_heap` (no arena in its standard library)." },
  { name = "scratch_arrays_heap" },
  { name = "scratch_arrays_region", note = "Rust: `Vec`, the same program as `scratch_arrays_heap`." },
]

[[workload]]
name = "groups"
title = "Task groups: tasks that return values"
kernels = [
  { name = "fib_64", ci = true, note = "Rust and C++: a thread per task (`std::thread::scope`, `std::async`), what their standard libraries offer." },
  { name = "tiny_100k", rust = "no standard-library task pool: a thread per task is not a comparable baseline", cpp = "no standard-library task pool: a thread per task is not a comparable baseline" },
]
