  { name = "insert_string_fast_100k", entry = "map_string", args = [0, 0, 100000] },
  { name = "hit_string_fast_100k", entry = "map_string", args = [1, 0, 100000], ci = true },
  { name = "miss_string_fast_100k", entry = "map_string", args = [2, 0, 100000] },
