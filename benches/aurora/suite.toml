# The AURORA benchmark suite: every workload and kernel `scripts/bench.py`
# runs. A workload is a directory holding a Codira package (`codira.toml`,
# `src/mod.code`), a Rust baseline (`<name>.rs`, or a Cargo project named by
# `rust_cargo`) and a C++ baseline (`<name>.cpp`). A kernel is one public
# function of the Codira program and one command-line argument of the
# baselines; all of them print the same check value.
#
# Kernel keys (besides those below, `check_differs = { cpp = "why" }`
# declares a variant whose check value differs for a known reason):
#   name           the function / argument
#   ci = true      part of the CI subset (`--suite ci`)
#   heap_limit_mb  the Codira GC heap cap for this kernel (default below)
#   codira | rust | cpp = "reason"   that variant does not exist, and why
#   note           shown under the workload's table
#   expected_failure = { codira = "why" }   known not to complete today

[defaults]
heap_limit_mb = 1024
runs = 11
ci_runs = 9
compile_runs = 5

[[workload]]
name = "strings"
title = "Strings: append, concatenation, splitting, search, parsing"
kernels = [
  { name = "append_short", ci = true },
  { name = "append_numbers", ci = true },
  { name = "concat", ci = true },
  { name = "split_lines" },
  { name = "split_fields", ci = true },
  { name = "find_10mb" },
  { name = "parse_i64" },
]

[[workload]]
name = "format"
title = "Formatting: integers, floats, format specs, the debug form"
kernels = [
  { name = "int_display", ci = true },
  { name = "int_zero_8", ci = true },
  { name = "float_display" },
  { name = "float_right_10_3", ci = true },
  { name = "debug_struct", ci = true },
]

[[workload]]
name = "result"
title = "Result propagation with `?`"
kernels = [
  { name = "wrapped_ok", ci = true },
  { name = "wrapped_err", ci = true },
  { name = "converted_err" },
  { name = "context_err" },
  { name = "propagate_depth8", ci = true },
]

[[workload]]
name = "collections"
title = "Arrays and pipelines"
kernels = [
  { name = "push_10m", ci = true, note = "libstdc++'s `std::vector` grows by allocating new memory and copying; Rust's `Vec` grows with `realloc`, which can remap the pages in place." },
  { name = "sum_for" },
  { name = "sort_1m", ci = true, note = "C++ is libstdc++'s `std::sort` (introsort); Rust's `sort_unstable` and Codira's `sort` are pattern-defeating quicksort (Codira's is Rust's)." },
  { name = "map_filter_sum_eager" },
  { name = "map_filter_sum_lazy", ci = true },
  { name = "map_filter_sum_fold" },
  { name = "enumerate_filter_count" },
  { name = "zip_fold_dot" },
  { name = "take_while_sum" },
  { name = "map_collect" },
  { name = "filter_collect", ci = true },
  { name = "range_filter_map_sum" },
  { name = "chain_filter_count", note = "C++ has no `views::concat` before C++26; it is two loops." },
]

[[workload]]
name = "loops"
title = "Numeric loops and calls"
kernels = [
  { name = "sum_for", ci = true },
  { name = "sum_indexed" },
  { name = "store_field", ci = true },
  { name = "copy_plus_one", ci = true },
  { name = "fib_32", ci = true },
  { name = "sieve_20m" },
  { name = "mandelbrot", ci = true },
  { name = "matmul_200" },
  { name = "collatz_1m" },
]

# The same hash function in all three (Codira's), then Rust's default
# seeded SipHash on its own rows: Codira's `Map` has no seeded hasher and
# the C++ standard library has none.
[[workload]]
name = "hashmap"
title = "Hash maps: the same hash function, and the default secure hasher"
kernels = [
  { name = "insert_i64", ci = true },
  { name = "lookup_i64", ci = true },
  { name = "insert_string" },
  { name = "lookup_string", ci = true },
  { name = "churn_i64", ci = true },
  { name = "insert_i64_secure", codira = "not yet possible: `Map` has no seeded, flooding-resistant hasher", cpp = "the C++ standard library has no seeded hasher" },
  { name = "lookup_i64_secure", codira = "not yet possible: `Map` has no seeded, flooding-resistant hasher", cpp = "the C++ standard library has no seeded hasher" },
  { name = "insert_string_secure", codira = "not yet possible: `Map` has no seeded, flooding-resistant hasher", cpp = "the C++ standard library has no seeded hasher" },
  { name = "lookup_string_secure", codira = "not yet possible: `Map` has no seeded, flooding-resistant hasher", cpp = "the C++ standard library has no seeded hasher" },
  { name = "churn_i64_secure", codira = "not yet possible: `Map` has no seeded, flooding-resistant hasher", cpp = "the C++ standard library has no seeded hasher" },
]

[[workload]]
name = "json"
title = "JSON: parsing, printing, pretty-printing"
setup = ["gen_inputs.py"]
rust_cargo = "rust/Cargo.toml"
rust_bin = "aurora_json_rust"
cxx_requires = "RapidJSON headers (`rapidjson-dev`)"
cxx = "g++"
cxx_why = "RapidJSON 1.1, as packaged, assigns to a const member in `GenericStringRef`, which clang 22 rejects"
kernels = [
  { name = "parse_twitter", ci = true },
  { name = "parse_canada", ci = true },
  { name = "parse_deep" },
  { name = "print_twitter", ci = true },
  { name = "print_canada", ci = true, check_differs = { cpp = "RapidJSON prints 320 of the 600,000 floats one or two digits longer than the shortest round-trip text (Grisu2), 357 bytes in all; the values read back the same" } },
  { name = "print_deep" },
  { name = "pretty_twitter" },
  { name = "pretty_canada", check_differs = { cpp = "RapidJSON prints 320 of the 600,000 floats one or two digits longer than the shortest round-trip text (Grisu2), 357 bytes in all; the values read back the same" } },
  { name = "pretty_deep" },
]

# A heap cap well above the live set, so that the collector runs often.
[[workload]]
name = "graph"
title = "Object graphs: allocation-heavy trees, cyclic graphs"
heap_limit_mb = 256
kernels = [
  { name = "binary_trees", ci = true },
  { name = "cyclic_graph", ci = true },
  { name = "linked_list" },
]

[[workload]]
name = "channels"
title = "Concurrent producers and consumers (bounded channels)"
kernels = [
  { name = "spsc", ci = true, note = "Rust's `sync_channel` (from crossbeam) spins before it sleeps; the C++ queue is the textbook mutex and condition variables, which sleep and wake a thread for most messages. Rust is the strong baseline here." },
  { name = "mpsc_4", ci = true },
  { name = "fan_out_in", note = "Bound by the latency of waking a worker: each job meets an empty channel." },
]

[[workload]]
name = "server"
title = "A server-style workload with high churn, and long runs under constrained heaps"
kernels = [
  { name = "requests", ci = true },
  { name = "long_run_heap_1024", entry = "long_run", arg = "long_run", heap_limit_mb = 1024 },
  { name = "long_run_heap_256", entry = "long_run", arg = "long_run", heap_limit_mb = 256 },
  { name = "long_run_heap_128", entry = "long_run", arg = "long_run", heap_limit_mb = 128, ci = true },
  { name = "long_run_heap_96", entry = "long_run", arg = "long_run", heap_limit_mb = 96 },
  { name = "long_run_heap_80", entry = "long_run", arg = "long_run", heap_limit_mb = 80 },
  { name = "long_run_heap_64", entry = "long_run", arg = "long_run", heap_limit_mb = 64, expected_failure = { codira = "the runtime aborts when a collection cannot make room under the cap" } },
]
