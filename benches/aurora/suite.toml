  { name = "insert_string_fast_1k", entry = "map_string", args = [0, 0, 1000] },
  { name = "hit_string_fast_1k", entry = "map_string", args = [1, 0, 1000] },
  { name = "miss_string_fast_1k", entry = "map_string", args = [2, 0, 1000] },
