# A minimal host that runs `main` of a built `.codiralib` with the runtime
# compiled in release mode, so that the runtime's string functions run
# optimized (as they do in a release build of `codira`). Built on its own,
# outside the workspace:
#
#   cargo build --release --manifest-path benches/strings/host/Cargo.toml
[package]
name = "string_bench_host"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
codira_runtime = { path = "../../../crates/codira_runtime" }
