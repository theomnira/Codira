[package]
name = "benches"
version = "0.1.0"
edition = "2021"
description = "Benchmarks for the Codira compiler and runtime"

[dependencies]

[dev-dependencies]
criterion = { version = "0.5.1", default-features = false }
mlua = { package = "mlua", version = "0.9.2", default-features = false, features = ["vendored", "luajit"] }
wasmer = { version = "6.0", default-features = false, features = ["sys-default"] }
codira_runtime = { path = "../crates/codira_runtime", default-features = false }
codira_compiler = { path = "../crates/codira_compiler", default-features = false }

[[bench]]
name = "benchmarks"
harness = false

[workspace]
# Empty workspace
