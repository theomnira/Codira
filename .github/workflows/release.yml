name: release
on:
  push:
    branches:
      - main
      - release/*

env:
  RUSTFLAGS: -Dwarnings

jobs:
  artifacts:
    name: Artifacts
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - os: "ubuntu-latest"
            dir: linux-x86_64
            artifacts: "codira libcodira_runtime.so"
            RUSTFLAGS: "-Dwarnings"
          - os: "windows-latest"
            dir: windows-x86_64
            artifacts: "codira.exe codira_runtime.dll codira_runtime.dll.lib"
            RUSTFLAGS: "-Dwarnings -Ctarget-feature=+crt-static"
          - os: "macOS-latest"
            dir: macos-x86_64
            artifacts: "codira libcodira_runtime.dylib"
            RUSTFLAGS: "-Dwarnings"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          override: true

      - name: Install LLVM (Linux)
        if: runner.os == 'Linux'
        run: sudo bash scripts/install-llvm.sh

      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        run: |
          # llvm@14 is the wrong major version -- Codira targets LLVM 22.1
          # (inkwell's `llvm22-1` feature) -- and was why this job's build
          # never got as far as needing Z3 to fail on: it would have failed
          # here first once LLVM version checking rejected the mismatch.
          brew install llvm@22
          llvm_prefix="$(brew --prefix llvm@22)"
          echo "${llvm_prefix}/bin" >> "$GITHUB_PATH"
          echo "LLVM_SYS_221_PREFIX=${llvm_prefix}" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=${llvm_prefix}/lib" >> "$GITHUB_ENV"

      - name: Install LLVM (Windows)
        if: runner.os == 'Windows'
        uses: ./.github/actions/install-llvm

      - name: Install Z3
        uses: ./.github/actions/install-z3

      - name: Cargo build
        uses: actions-rs/cargo@v1
        env:
          RUSTFLAGS: ${{ matrix.config.RUSTFLAGS }}
        with:
          command: build
          args: --release

      - run: mkdir -p ${{ matrix.config.dir }}

      - name: Move artifacts
        env:
          ARTIFACTS: ${{ matrix.config.artifacts }}
          OUT_DIR: ${{ matrix.config.dir }}
        run: |
          import os
          artifacts = os.environ['ARTIFACTS'].split()
          for artifact in artifacts:
            src = "target/release/%s" % artifact
            dst = os.environ['OUT_DIR'] + "/" + artifact
            os.rename(src, dst)
        shell: python

      - uses: actions/upload-artifact@master
        with:
          name: ${{ matrix.config.dir }}
          path: ${{ matrix.config.dir }}
