name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - release/*

env:
  RUSTFLAGS: -Dwarnings
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install libasound2-dev libudev-dev

      - name: Install Rust (stable)
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          override: true

      - name: Install LLVM
        uses: ./.github/actions/install-llvm

      - name: Install Z3
        uses: ./.github/actions/install-z3

      - uses: Swatinem/rust-cache@v2

      - name: Cargo check
        uses: actions-rs/cargo@v1
        with:
          command: check
          args: --all-targets

  test:
    name: Test Rust
    runs-on: ${{ matrix.os }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-22.04", "windows-latest", "macOS-latest"]
        include:
          - RUSTFLAGS: "-Dwarnings"
            CARGO_INCREMENTAL: 1
            CARGO_TARGET_DIR: "target"
          - os: "windows-latest"
            RUSTFLAGS: "-Dwarnings -Ctarget-feature=+crt-static -Lnative=C:\\winsdk-um-x64"
            CARGO_INCREMENTAL: 0
            CARGO_TARGET_DIR: "C:\\cargo-target-dir"
    env:
      RUSTFLAGS: ${{ matrix.RUSTFLAGS }}
      CARGO_INCREMENTAL: ${{ matrix.CARGO_INCREMENTAL }}
      # Disable generating debug info, we don't need it here anyway and its only using disk space
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_TARGET_DIR: ${{ matrix.CARGO_TARGET_DIR }}
      # cargo-llvm-cov names each process's profile <name>-%p-%m.profraw, one
      # file per process. The funis shell tests run the instrumented linker
      # thousands of times, so the profiles are merged as they are written
      # instead, into a pool of at most 8 files per instrumented binary.
      LLVM_PROFILE_FILE_NAME: codira-%8m.profraw
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Link the Windows SDK libraries
        uses: ./.github/actions/windows-sdk-libs

      - name: Install packages
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install libasound2-dev libudev-dev
          # The funis shell tests link for the cross targets too, and run
          # their programs under QEMU, when these are installed.
          sudo apt-get install -y qemu-user \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            gcc-riscv64-linux-gnu g++-riscv64-linux-gnu

      - name: Install LLVM
        uses: ./.github/actions/install-llvm

      - name: Install Z3
        uses: ./.github/actions/install-z3

      - name: Install nightly rustfmt
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          profile: minimal
          components: rustfmt

      - name: Install stable toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          override: true
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        if: matrix.os != 'windows-latest'

      - name: Install latest llvm-cov release
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install latest nextest release
        uses: taiki-e/install-action@nextest

      - name: Test with latest nextest release
        uses: actions-rs/cargo@v1
        with:
          command: llvm-cov
          args: nextest --all-features --workspace --lcov --output-path lcov.info --profile ci

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: lcov.info
          name: ${{ matrix.os }}
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  doctest:
    name: Doctest Rust
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-22.04", "windows-latest", "macOS-latest"]
        include:
          - RUSTFLAGS: "-Dwarnings"
            CARGO_INCREMENTAL: 1
          - os: "windows-latest"
            RUSTFLAGS: "-Dwarnings -Ctarget-feature=+crt-static -Lnative=C:\\winsdk-um-x64"
            CARGO_INCREMENTAL: 0
    env:
      RUSTFLAGS: ${{ matrix.RUSTFLAGS }}
      CARGO_INCREMENTAL: ${{ matrix.CARGO_INCREMENTAL }}
      # Disable generating debug info, we don't need it here anyway and its only using disk space
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Link the Windows SDK libraries
        uses: ./.github/actions/windows-sdk-libs

      - name: Install LLVM
        uses: ./.github/actions/install-llvm

      - name: Install Z3
        uses: ./.github/actions/install-z3

      - name: Install packages
        if: matrix.os == 'ubuntu-20.04'
        run: |
          sudo apt-get update
          sudo apt-get install libasound2-dev libudev-dev

      - name: Install toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal

      - uses: Swatinem/rust-cache@v2

      - name: Doctests
        uses: actions-rs/cargo@v1
        with:
          command: test
          args: --doc --all-features

  # There is no mdbook job: it tested and built `book/`, and the repository
  # has no book. A job for it belongs with the book, when there is one.

  test-cpp:
    name: Test C++ Runtime
    runs-on: ${{ matrix.os }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-22.04", "windows-latest", "macOS-latest"]
        include:
          - RUSTFLAGS: "-Dwarnings"
          - os: "windows-latest"
            RUSTFLAGS: "-Dwarnings -Ctarget-feature=+crt-static -Lnative=C:\\winsdk-um-x64"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Link the Windows SDK libraries
        uses: ./.github/actions/windows-sdk-libs

      - name: Install LLVM
        uses: ./.github/actions/install-llvm

      - name: Install Z3
        uses: ./.github/actions/install-z3

      - name: Install nightly rustfmt
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          profile: minimal
          components: rustfmt

      - name: Install stable toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          override: true

      - uses: Swatinem/rust-cache@v2

      - name: Cargo build
        uses: actions-rs/cargo@v1
        env:
          RUSTFLAGS: ${{ matrix.RUSTFLAGS }}
        with:
          command: build
          args: -p codira -p codira_runtime_capi

      - name: Create build folder (debug)
        run: cmake -E make_directory ${{ runner.workspace }}/build/debug

      - name: Create build folder (release)
        run: cmake -E make_directory ${{ runner.workspace }}/build/release

      - name: Configure cmake (debug)
        working-directory: ${{ runner.workspace }}/build/debug
        run: cmake -DCMAKE_BUILD_TYPE=Debug -S ${{ github.workspace }} -Dcodira_build_examples=ON -Dcodira_build_tests=ON -Dcodira_binaries_path=${{ github.workspace }}/target/debug/ -Dcodira_examples_path=${{ github.workspace }}/examples

      - name: Configure cmake (release)
        working-directory: ${{ runner.workspace }}/build/release
        run: cmake -DCMAKE_BUILD_TYPE=Release -S ${{ github.workspace }} -Dcodira_build_examples=ON -Dcodira_build_tests=ON -Dcodira_binaries_path=${{ github.workspace }}/target/debug/ -Dcodira_examples_path=${{ github.workspace }}/examples

      - name: Build (debug)
        working-directory: ${{ runner.workspace }}/build/debug
        run: cmake --build . --config Debug

      - name: Build (release)
        working-directory: ${{ runner.workspace }}/build/release
        run: cmake --build . --config Release

      - name: Test (debug)
        working-directory: ${{ runner.workspace }}/build/debug
        run: ctest -C Debug

      - name: Test (release)
        working-directory: ${{ runner.workspace }}/build/release
        run: ctest -C Release

  style:
    name: Check Style
    runs-on: ubuntu-22.04
    needs: check
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install nightly rustfmt
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          profile: minimal
          components: rustfmt

      - name: Install stable toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          override: true
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Run cargo fmt
        uses: actions-rs/cargo@v1
        with:
          toolchain: nightly
          command: fmt
          args: --all -- --check

      - name: Install LLVM
        uses: ./.github/actions/install-llvm

      - name: Install Z3
        uses: ./.github/actions/install-z3

      - name: Run cargo clippy
        uses: actions-rs/clippy-check@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          args: --all-features
