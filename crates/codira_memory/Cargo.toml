[package]
name = "codira_memory"
description = "Memory management functionality for Codira"
keywords = ["game", "hot-reloading", "language", "codira", "scripting"]
categories.workspace = true
version.workspace = true
authors.workspace = true
edition.workspace = true
documentation.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
codira_abi = { version = "0.6.0-dev", path = "../codira_abi" }
codira_capi_utils = { version = "0.6.0-dev", path = "../codira_capi_utils" }
itertools = { workspace = true }
lazy_static = { workspace = true }
once_cell = { workspace = true }
parking_lot = { workspace = true }
rustc-hash = { workspace = true, features = ["std"] }
thiserror = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2.167"

[dev-dependencies]
codira_capi_utils = { version = "0.6.0-dev", path = "../codira_capi_utils", features = ["insta"] }
insta = { workspace = true, features = ["ron"] }
paste = { workspace = true }

[[bench]]
name = "gc"
harness = false

[target.'cfg(loom)'.dependencies]
loom = "0.7"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }
