[package]
name = "codira_codegen"
description = "LLVM IR code generation for Codira"
keywords = ["game", "hot-reloading", "language", "codira", "scripting"]
categories.workspace = true
version.workspace = true
authors.workspace = true
edition.workspace = true
documentation.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true

[features]
default = [
    "target-x86",
    "target-aarch64",
    "target-riscv",
    "target-webassembly",
    "target-nvptx",
    "in-process-lld",
]
# Each `target-*` feature forwards to the matching inkwell/LLVM target
# backend and gates that target's `Target::initialize_*` call in `db.rs`.
# Compiling standalone LLVM target-backend static libraries (e.g. an
# AArch64-only distribution) is common, so a consumer can build against a
# narrower LLVM distribution by disabling the targets it doesn't have
# (`--no-default-features --features target-x86`, for instance) instead of
# `target_machine()` unconditionally requiring every target's static libs to
# link, regardless of which target is actually being compiled for.
target-x86 = ["inkwell/target-x86"]
target-aarch64 = ["inkwell/target-aarch64"]
target-riscv = ["inkwell/target-riscv"]
target-webassembly = ["inkwell/target-webassembly"]
# NVIDIA PTX, for `@target(gpu)` kernels (`gpu.rs`).
target-nvptx = ["inkwell/target-nvptx"]
# Links LLD into the compiler so the final link is a function call instead of
# a spawned `lld-link` -- see `linker::run_lld` for what that is worth. This
# needs LLD's headers and static libraries next to the LLVM build, which a
# from-source LLVM built with `-DLLVM_ENABLE_PROJECTS=lld` has and most
# prebuilt distributions do not. Disable it to build against one of those;
# every link then spawns the linker, exactly as before.
#
# Only Windows hosts link LLD in, whatever this feature says: `codira_lld` is
# a Windows-only dependency below. That is where it has been built, run and
# measured. On ELF and Mach-O hosts LLD's static libraries have to be ordered
# against LLVM's on the link line, which nobody has verified, and a feature
# that is on by default must not be able to break a build it was never tried
# on. Those hosts keep spawning the linker until someone has.
in-process-lld = ["dep:codira_lld"]

[dependencies]
codira_abi = { version = "0.6.0-dev", path = "../codira_abi" }
codira_image = { version = "0.6.0-dev", path = "../codira_image" }
anyhow = { workspace = true, features = ["std"] }
array-init = { workspace = true }
by_address = { workspace = true }
bytemuck = { workspace = true }
codira_hir = { version = "0.6.0-dev", path = "../codira_hir" }
codira_hir_input = { version = "0.6.0-dev", path = "../codira_hir_input" }
codira_mir = { version = "0.6.0-dev", path = "../codira_mir" }
codira_egraph = { version = "0.6.0-dev", path = "../codira_egraph" }
codira_comptime = { version = "0.6.0-dev", path = "../codira_comptime" }
inkwell = { workspace = true, features = ["llvm22-1"], default-features = false }
itertools = { workspace = true }
# A direct dependency only so its build script reports where `llvm-config`
# lives (`DEP_LLVM_22_CONFIG_PATH`) to ours; inkwell already links it.
llvm-sys = "221.0.1"
codira_codegen_macros = { version = "0.6.0-dev", path = "../codira_codegen_macros" }
codira_target = { version = "0.6.0-dev", path = "../codira_target" }
codira_syntax = { version = "0.6.0-dev", path = "../codira_syntax" }
# Proves `@rewrite` rules before Eidos may use them (`rewrite.rs`).
codira_tv = { version = "0.6.0-dev", path = "../codira_tv" }
# Reads the symbols a package's assembled native objects define (`native`),
# and the objects `test_targets` builds for every target.
object = { version = "0.36.5", default-features = false, features = ["std", "read"] }
once_cell = { workspace = true }
parking_lot = { workspace = true }
paste = { workspace = true }
codira_paths = { version = "0.6.0-dev", path = "../codira_paths" }
rustc-hash = { workspace = true }
salsa = { workspace = true }
smallvec = { workspace = true, features = ["union"] }
smol_str = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }

[[example]]
name = "image_bench"
required-features = ["in-process-lld"]

[build-dependencies]
cc = "1.2.2"

[target.'cfg(windows)'.dependencies]
codira_lld = { version = "220.0.0", path = "../codira_lld", optional = true }

[dev-dependencies]
codira_abi = { path = "../codira_abi", features = ["serde"] }
insta = { workspace = true, features = ["ron"] }
codira_comptime = { path = "../codira_comptime" }
codira_libloader = { path = "../codira_libloader" }
codira_test = { path = "../codira_test" }
codira_runtime = { path = "../codira_runtime" }
codira_gpu = { path = "../codira_gpu" }
wasmi = { version = "2", default-features = false, features = ["std", "validate", "stable", "auto-dispatch"] }
