[package]
name = "codira_runtime"
description = "A runtime for hot reloading and invoking Codira from Rust"
keywords = ["game", "hot-reloading", "language", "codira", "scripting"]
categories.workspace = true
version.workspace = true
authors.workspace = true
edition.workspace = true
documentation.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
codira_abi = { version = "0.6.0-dev", path = "../codira_abi" }
codira_libloader = { version = "0.6.0-dev", path = "../codira_libloader" }
# Used to resolve `extern "C"` symbols from the host process at load time.
libloading = { workspace = true }
codira_capi_utils = { version = "0.6.0-dev", path = "../codira_capi_utils" }
codira_memory = { version = "0.6.0-dev", path = "../codira_memory" }
codira_project = { version = "0.6.0-dev", path = "../codira_project" }
itertools = { workspace = true, features = ["use_alloc"] }
log = { workspace = true }
notify = { workspace = true }
once_cell = { workspace = true }
parking_lot = { workspace = true }
crossbeam-deque = { workspace = true }
rustc-hash = { workspace = true }
seq-macro = { workspace = true }
thiserror = { workspace = true }
# The hash services (`native_hash`): reviewed implementations, never our own.
sha2 = { workspace = true }
blake3 = { workspace = true }
# The entropy service (`native_random`): the operating system's generator.
getrandom = { workspace = true }
# Shortest round-trip float formatting for `std.json` (`native_json`).
ryu = { workspace = true }
# The byte scan of `lines()` and of `split` on one ASCII byte.
memchr = { workspace = true }
# The database services (`native_db`) and tensor services (`native_ai`).
codira_db = { version = "0.6.0-dev", path = "../codira_db" }
codira_ai = { version = "0.6.0-dev", path = "../codira_ai" }

[target.'cfg(unix)'.dependencies]
# `close(2)` with its error and `F_FULLFSYNC` (`native_fs`).
libc = { workspace = true }

[build-dependencies]
cc = "1.2.2"

[dev-dependencies]
codira_compiler = { path = "../codira_compiler" }
codira_test = { path = "../codira_test" }
tempfile = { workspace = true }
termcolor = { workspace = true }

[[bench]]
name = "fuel"
harness = false
