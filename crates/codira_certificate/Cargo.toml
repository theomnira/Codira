[package]
name = "codira_certificate"
description = "Proof certificates for Codira artifacts: the record `codira build --certify` writes, and the checker `codira certify` runs without the compiler's front end"
keywords = ["codira", "compiler", "verification", "proof-carrying-code"]
categories.workspace = true
version.workspace = true
authors.workspace = true
edition.workspace = true
documentation.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
codira_smt = { version = "0.6.0-dev", path = "../codira_smt" }
object = { version = "0.36.5", default-features = false, features = ["std", "read"] }
serde = { workspace = true, features = ["std"] }
serde_derive = { workspace = true }
serde_json = { workspace = true, features = ["std"] }
sha2 = "0.10.8"
